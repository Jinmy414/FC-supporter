name: Publish FC Supporter website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Test and package browser extension
        run: npm test
      - name: Check website resources and syntax
        run: npm run check
      - name: Install browser engines for acceptance
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test desktop and mobile browser flows
        run: npm run test:browser
      - name: Save browser screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: artifacts/
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy test site
        id: deployment
        uses: actions/deploy-pages@v4
