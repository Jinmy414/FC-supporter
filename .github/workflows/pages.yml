name: Publish FC Supporter website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package browser extension
        run: |
          mkdir -p site/downloads
          rm -f site/downloads/fc-supporter.zip
          zip -q -r site/downloads/fc-supporter.zip manifest.json popup.html popup.css popup.js app.html app.css app.js core.js README.md data/players-template.csv
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy install site
        id: deployment
        uses: actions/deploy-pages@v4
