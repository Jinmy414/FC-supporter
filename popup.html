<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FC Supporter</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="popup">
    <div class="brand-mark">FC</div>
    <div>
      <h1>FC Supporter</h1>
      <p>EA 页面增强与本地规划</p>
    </div>
    <button id="openEA" type="button">打开 EA FC 增强面板 <span>↗</span></button>
    <label class="native-option"><input id="nativeEnabled" type="checkbox">在 EA 页面启用恢复的原客户端</label>
    <button id="openApp" type="button" class="secondary">打开离线规划工具 <span>↗</span></button>
    <small id="nativeStatus">EA 模式连接 fodder.gg 原服务，保留原账号与 Gold 权限；离线规划工具使用本地名单。</small>
  </main>
  <script src="popup.js"></script>
</body>

</html>
